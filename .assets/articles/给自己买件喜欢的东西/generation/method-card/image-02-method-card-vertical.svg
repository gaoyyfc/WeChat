<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="table" tableValues="0 0.032"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="#F8F3EB"/>
  <rect width="1080" height="1440" fill="#F8F3EB" filter="url(#paper)"/>

  <text x="105" y="155" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="40" font-weight="400" fill="#514B44" letter-spacing="1">买之前，先问问自己</text>

  <g>
    <rect x="88" y="228" width="904" height="300" rx="34" fill="#F3E7DF"/>
    <g transform="translate(150 313) scale(0.86)" fill="none" stroke="#AC735C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 28h115a18 18 0 0 1 18 18v72a18 18 0 0 1-18 18H18A18 18 0 0 1 0 118V46a18 18 0 0 1 18-18Z"/>
      <path d="M28 28 90 2l21 26"/>
      <path d="M108 68h54v43h-54a17 17 0 0 1-17-17v-9a17 17 0 0 1 17-17Z"/>
      <circle cx="116" cy="89" r="4" fill="#AC735C" stroke="none"/>
    </g>
    <text x="360" y="344" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="56" font-weight="500" fill="#39352F">买得起吗？</text>
    <text x="360" y="418" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="400" fill="#625B54">不影响必要开支和原有储蓄计划</text>
  </g>

  <g>
    <rect x="88" y="565" width="904" height="300" rx="34" fill="#E8EEE7"/>
    <g transform="translate(158 646) scale(0.86)" fill="none" stroke="#829480" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 132 18 81C-19 46 31-8 72 35 113-8 163 46 126 81l-16 15"/>
      <circle cx="119" cy="101" r="33"/>
      <path d="m144 126 28 28"/>
    </g>
    <text x="360" y="681" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="56" font-weight="500" fill="#39352F">真喜欢吗？</text>
    <text x="360" y="755" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="400" fill="#625B54">隔一天再看，是否依然心动</text>
  </g>

  <g>
    <rect x="88" y="902" width="904" height="300" rx="34" fill="#EEEAE5"/>
    <g transform="translate(154 968) scale(0.82)" fill="none" stroke="#514B44" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 4v154M31 158h98M16 32h128M80 13l64 19M80 13 16 32"/>
      <path d="m16 32-25 63h50L16 32ZM144 32l-25 63h50l-25-63Z"/>
      <path d="M-9 95c4 17 12 27 25 27s21-10 25-27M119 95c4 17 12 27 25 27s21-10 25-27"/>
    </g>
    <text x="360" y="1018" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="56" font-weight="500" fill="#39352F">值得取舍吗？</text>
    <text x="360" y="1092" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="400" fill="#625B54">愿不愿意为它放弃另一项消费</text>
  </g>
</svg>
